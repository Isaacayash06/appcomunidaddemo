<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba la app — demo en vivo</title>
<style>
  :root { --bg:#f6f4ef; --ink:#14161c; --muted:#5d6270; --accent:#1B2E5E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --ink:#eceef3; --muted:#9aa1b0; --accent:#8fa6ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
  main { max-width:1100px; margin:0 auto; padding:48px 16px 72px; }
  h1 { font-size:clamp(28px,5vw,44px); line-height:1.1; margin:0 0 12px; text-align:center; letter-spacing:-.02em; }
  .lead { text-align:center; color:var(--muted); max-width:560px; margin:0 auto 36px; font-size:18px; }
  chai-demo-frame { --cdf-accent: var(--accent); }
  h2 { font-size:20px; margin:72px 0 6px; text-align:center; }
  .small { max-width:360px; margin:24px auto 0; }
  code { background:rgba(127,127,127,.15); padding:2px 6px; border-radius:6px; font-size:.9em; }
</style>
</head>
<body>
<main>
  <h1>Pruébala tú mismo</h1>
  <p class="lead">Esta es la app de una comunidad, funcionando de verdad. Toca, navega y cámbiala de móvil a portátil.</p>

  <!-- Versión grande: elemento principal de /comunidades -->
  <chai-demo-frame src="../" max-height="780"></chai-demo-frame>

  <!-- Versión pequeña: bloque "Para comunidades" de la home (solo móvil, sin interruptor) -->
  <h2>Versión pequeña (home)</h2>
  <p class="lead" style="font-size:15px;margin-bottom:0">Mismo componente, con <code>no-toggle</code> y <code>max-height</code> menor.</p>
  <div class="small">
    <chai-demo-frame src="../" no-toggle max-height="520" label="Ver a pantalla completa"></chai-demo-frame>
  </div>
</main>
<script src="demo-frame.js"></script>
</body>
</html>
