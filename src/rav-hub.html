<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <style>html,body{background:#FAF5EE}</style>
  <style>
    #pt-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#FAF5EE;transition:opacity .2s ease}
    #pt-overlay .pt-spinner{width:40px;height:40px;border-radius:50%;border:3px solid rgba(27,46,94,.15);border-top-color:#1B2E5E;animation:pt-spin .8s linear infinite}
    @keyframes pt-spin{to{transform:rotate(360deg)}}
    body.page-ready #pt-overlay{opacity:0;pointer-events:none}
  </style>
  <link rel="icon" type="image/png" sizes="48x48" href="img/icon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <title>{{name}} — Torá y Comunidad</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <style>
    .main-content {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      background: var(--color-bg);
    }
    @media (max-width: 768px) { .main-content { margin-left: 0; } }

    .rav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 28px 80px;
    }
    @media (max-width: 768px) { .rav-inner { padding: 72px 16px 100px; } }

    /* ─── Tabs ─── */
    .rav-tabs {
      display: flex;
      gap: 2px;
      border-bottom: 2px solid var(--color-border);
      margin-bottom: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .rav-tabs::-webkit-scrollbar { display: none; }

    .rav-tab {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--color-text-muted);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      white-space: nowrap;
      transition: all var(--transition-fast);
      font-family: inherit;
    }
    .rav-tab svg { width: 16px; height: 16px; }
    .rav-tab:hover { color: var(--color-text); }
    .rav-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
      font-weight: 600;
    }
    @media (max-width: 480px) {
      .rav-tab { padding: 9px 12px; font-size: 0.8rem; gap: 0; }
      .rav-tab svg { display: none; }
    }

    /* ─── Iframe panels ─── */
    .rav-panel { display: none; }
    .rav-panel.active { display: block; }

    .rav-iframe {
      width: 100%;
      border: none;
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      min-height: calc(100vh - 160px);
      display: block;
    }
    @media (max-width: 768px) {
      .rav-iframe { min-height: calc(100vh - 140px); }
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b2e5e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{name}}">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);}</script>
  <script defer src='/_vercel/insights/script.js'></script>
  <script>window.si=window.si||function(){(window.siq=window.siq||[]).push(arguments);}</script>
  <script defer src='/_vercel/speed-insights/script.js'></script>
  <!-- Transición sin hueco crema: si el navegador soporta View Transitions
       entre páginas (Safari/WKWebView iOS 18.2+, Chrome 123+), no se pinta
       nada de la página nueva hasta que #pt-ready (final del body) se ha
       leído; mientras, se sigue viendo la anterior y luego hay crossfade.
       Sin soporte: todo igual que antes (overlay + spinner). -->
  <script>if('PageRevealEvent' in window){document.documentElement.classList.add('vt');document.write('<link rel="expect" href="#pt-ready" blocking="render">');}</script>
  <style>html.vt:not(.vt-wait) #pt-overlay{display:none!important}html.vt body:not(.page-ready) .main-content{visibility:visible!important}</style>
  <script src="js/lang-en.js"></script>
</head>
<body>
<div id="pt-overlay"><div class="pt-spinner"></div></div>
<script>document.addEventListener("DOMContentLoaded",function(){document.body.classList.add("page-ready");});</script>

<div id="sidebar-placeholder"></div>

<div class="main-content">
  <div class="rav-inner">

    <h1 style="font-size:1.5rem;font-weight:700;color:var(--color-text);margin-bottom:20px;font-family:var(--font-brand);">Torá y Comunidad</h1>

    <!-- ═══ TABS ═══ -->
    <div class="rav-tabs" id="rav-tabs">
      <button class="rav-tab active" data-tab="shiurim">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 3.741-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5"/></svg>
        Shiurim
      </button>
      <button class="rav-tab" data-tab="preguntas">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"/></svg>
        Preguntas al Rav
      </button>
      <button class="rav-tab" data-tab="citas">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H18v-.008Zm0 2.25h.008v.008H18V15Z"/></svg>
        Cita con el Rav
      </button>
    </div>

  </div>
</div>

<script>
  // Página legado: solo redirige. NO cargar auth.js/nav.js aquí — su chequeo
  // de sesión es async y esta página navega fuera inmediatamente, lo que
  // corta esa comprobación a mitad y puede disparar un cierre de sesión
  // espurio antes de aterrizar en shiurim.html (que ya hace su propio
  // requireAuth() real).
  window.location.replace('shiurim.html');
</script>
<div id="pt-ready" hidden></div>
</body>
</html>
